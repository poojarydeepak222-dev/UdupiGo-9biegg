name: Deploy UdupiGo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fix PublicStore website query order
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/PublicStore.tsx')
          s = p.read_text()
          marker = '  // Load pages\n'
          start = s.find('  // Load website\n')
          end = s.find('  // Load products\n', start)
          if start == -1 or end == -1 or marker not in s:
              raise SystemExit('PublicStore query markers not found')
          website_block = s[start:end]
          s = s[:start] + s[end:]
          insert_at = s.find(marker)
          s = s[:insert_at] + website_block + '\n' + s[insert_at:]
          p.write_text(s)
          print('Moved website query before pages/widgets queries')
          PY

      - name: Build
        run: npm run build

      - name: Create GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
