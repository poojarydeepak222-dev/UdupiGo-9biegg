name: Deploy UdupiGo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Website Design Studio safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/WebsiteBuilder.tsx')
          s = p.read_text()
          changed = False

          if "@/components/website/DesignStudio" not in s:
              anchor = "import BottomNav from '@/components/layout/BottomNav';"
              if anchor not in s:
                  raise SystemExit('Design Studio: import anchor not found')
              s = s.replace(anchor, anchor + "\nimport DesignStudio from '@/components/website/DesignStudio';", 1)
              changed = True

          old = "type TabId = 'dashboard' | 'setup' | 'products' | 'orders' | 'pages' | 'widgets' | 'publish';"
          new = "type TabId = 'dashboard' | 'setup' | 'design' | 'products' | 'orders' | 'pages' | 'widgets' | 'publish';"
          if "type TabId = 'dashboard' | 'setup' | 'design'" not in s:
              if old not in s:
                  raise SystemExit('Design Studio: TabId anchor not found')
              s = s.replace(old, new, 1)
              changed = True

          if "id: 'design', label: 'Design'" not in s:
              anchor = "    { id: 'setup', label: 'Setup', icon: '⚙️' },"
              if anchor not in s:
                  raise SystemExit('Design Studio: tab anchor not found')
              s = s.replace(anchor, anchor + "\n    { id: 'design', label: 'Design', icon: '🎨' },", 1)
              changed = True

          if "activeTab === 'design'" not in s:
              anchor = "      {/* ── SETUP TAB ── */}"
              if anchor not in s:
                  raise SystemExit('Design Studio: setup render anchor not found')
              block = '''      {/* ── DESIGN STUDIO TAB ── */}
      {activeTab === 'design' && (
        <DesignStudio
          value={{ theme_color: setupForm.theme_color, template: setupForm.template }}
          onChange={(patch) => setSetupForm(f => ({ ...f, ...patch }))}
          onSave={() => saveMutation.mutate()}
          saving={saveMutation.isPending}
        />
      )}

'''
              s = s.replace(anchor, block + anchor, 1)
              changed = True

          p.write_text(s)
          print('Design Studio patch applied' if changed else 'Design Studio already present')
          PY

      - name: Build
        run: npm run build

      - name: Create GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
